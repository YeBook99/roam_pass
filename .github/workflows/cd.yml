# CD — main에 머지되면(= develop → main 릴리스 PR) 이미지를 빌드해 GHCR에 올리고 EC2에 배포한다.
#   배포 job은 environment 'production'을 사용 → Settings에서 Required reviewers를 걸면 승인 후 배포(수동 게이트)
#   EC2가 준비되기 전에는 저장소 변수 DEPLOY_ENABLED를 설정하지 않으면 배포 job이 건너뛰어진다.
# 필요한 설정: secrets.EC2_HOST, secrets.EC2_SSH_KEY / vars.SITE_DOMAIN, vars.DEPLOY_ENABLED=true
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false            # 배포는 중간에 끊지 않는다

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: 이미지 빌드·푸시 (GHCR)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    outputs:
      ready: ${{ steps.detect.outputs.backend == 'true' && steps.detect.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: bash scripts/ci/detect-parts.sh
      - name: 이미지 이름 (소문자)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/roampass" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
        if: steps.detect.outputs.backend == 'true' && steps.detect.outputs.frontend == 'true'
      - uses: docker/login-action@v3
        if: steps.detect.outputs.backend == 'true' && steps.detect.outputs.frontend == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: backend
        if: steps.detect.outputs.backend == 'true' && steps.detect.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64       # EC2(x86_64) 기준
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }},${{ env.IMAGE_PREFIX }}-backend:latest
      - name: frontend
        if: steps.detect.outputs.backend == 'true' && steps.detect.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }},${{ env.IMAGE_PREFIX }}-frontend:latest

  deploy:
    name: EC2 배포
    needs: images
    if: needs.images.outputs.ready == 'true' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    environment:
      name: production
      url: https://${{ vars.SITE_DOMAIN }}
    steps:
      - name: SSH 키 준비
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: 새 이미지로 교체
        run: |
          ssh -i ~/.ssh/ec2.pem "ec2-user@${{ secrets.EC2_HOST }}" \
            "cd ~/roampass && export IMAGE_TAG=${{ github.sha }} \
             && docker compose -f docker-compose.prod.yml pull \
             && docker compose -f docker-compose.prod.yml up -d \
             && docker image prune -f"
      - name: 헬스 체크 (최대 2분)
        run: |
          for _ in $(seq 1 24); do
            if curl -fsS "https://${{ vars.SITE_DOMAIN }}/api/plans" > /dev/null; then echo "OK"; exit 0; fi
            sleep 5
          done
          echo "::error::배포 후 /api/plans 응답 없음"; exit 1
