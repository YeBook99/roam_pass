# e2e 전용 덮어쓰기 — 기본 docker-compose.yml 위에 겹쳐서 쓴다.
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
# 운영 값(콜백 타임아웃 2분, 환불 백오프 1분/5분)으로는 e2e가 너무 오래 걸리므로 시간 관련 설정만 줄인다.
# 로직(상한 3회, 상태 전이)은 운영과 같다. 프로퍼티 이름은 .claude/skills/e2e/SKILL.md "설정 계약"을 따른다.
services:
  backend:
    environment:
      MOCK_ENABLED: "true"
      APP_ORDER_PAYMENT_TTL: PT2M
      APP_ISSUE_CALLBACK_TIMEOUT: PT5S
      APP_ISSUE_MAX_ATTEMPTS: "3"
      APP_REFUND_MAX_ATTEMPTS: "3"
      APP_REFUND_BACKOFF: PT1S,PT2S
      APP_SCHEDULER_DELAY_MS: "1000"
      APP_INSTALL_POLL_MIN_INTERVAL: PT2S
      MOCK_SUPPLIER_CALLBACK_DELAY_MS: "500"
